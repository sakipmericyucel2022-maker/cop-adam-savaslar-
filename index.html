<script>
const $=document.getElementById('app');
const E=[{n:'Kızıl Krallık',c:'#e04040'},{n:'Mavi Hanedan',c:'#4a7be0'},{n:'Yeşil Konfederasyon',c:'#3dbb4d'},{n:'Mor Sultanlık',c:'#a550d8'},{n:'Altın İmparatorluk',c:'#e8b820'},{n:'Kara Lejyon',c:'#aaaaaa'}];
const CN=['Batı Seferi','Doğu Seferi','Kuzey Seferi','Krallık Haritası'],DN=['Kolay','Orta','Zor'],DM=[1,1.5,2];
const U=[{n:'Kılıççı',cost:40,hp:60,dm:8,rg:22,sp:55,cd:.7},{n:'Okçu',cost:60,hp:35,dm:7,rg:180,sp:45,cd:1},{n:'Mızraklı',cost:55,hp:80,dm:9,rg:40,sp:45,cd:.9},{n:'Şövalye',cost:130,hp:170,dm:18,rg:28,sp:90,cd:.8},{n:'Büyücü',cost:90,hp:40,dm:16,rg:155,sp:40,cd:1.3},{n:'Dev',cost:220,hp:480,dm:40,rg:42,sp:30,cd:1.3},{n:'Kalkanlı',cost:75,hp:150,dm:7,rg:26,sp:38,cd:.9}];

const K=[{id:'zirh',n:'Demir Zırh',p:'+%25 can',currency:'dia',c:30,hp:1.25},{id:'pel',n:'Kızıl Pelerin',p:'+%20 hasar',currency:'dia',c:40,dm:1.2},{id:'tac',n:'Altın Taç',p:'+%30 altın geliri',currency:'dia',c:50,gold:1.3},{id:'cizme',n:'Rüzgar Çizmesi',p:'+%20 hız',currency:'dia',c:35,sp:1.2},{id:'goz',n:'Şahin Gözü',p:'+%25 menzil',currency:'dia',c:45,rg:1.25},{id:'buz',skin:1,n:'Buz Giysisi',p:'Buz görünümü, +%20 can, +%10 hasar',currency:'altin',c:75,hp:1.2,dm:1.1},{id:'ates',skin:1,n:'Ateş Giysisi',p:'Alevli görünüm, +%30 hasar',currency:'altin',c:85,dm:1.3},{id:'iskelet',skin:1,n:'İskelet Giysisi',p:'Kemik görünümü, +%30 can, +%10 hız',currency:'altin',c:95,hp:1.3,sp:1.1},{id:'kral',n:'Kral Ruhu',p:'+%10 can, hasar, hız, altın',currency:'dia',c:120,hp:1.1,dm:1.1,sp:1.1,gold:1.1}];
let S={dia:0,altin:0,kingdomRewarded:false,kingdomMapRewarded:false,startBonusClaimed:false,startBonusAmount:0,own:[],prog:[0,0,0,0],diff:0,skin:''},cur=0,G=null,raf=0,last=0,ctx=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('csw')||'{}'))}catch(e){}
S.spl=S.spl||[];S.zsp=S.zsp||{};S.znight=Number(S.znight)||0;S.zwins=Number(S.zwins)||0;S.upg=S.upg||{hp:0,dm:0,sp:0};S.prog=(S.prog||[0,0,0]).concat([0,0,0,0]).slice(0,4);S.altin=Number(S.altin)||0;S.kingdomRewarded=!!S.kingdomRewarded;S.kingdomMapRewarded=!!S.kingdomMapRewarded;S.startBonusClaimed=!!S.startBonusClaimed;S.startBonusAmount=Number(S.startBonusAmount)||0;S.questStats=S.questStats||{wins:0,units:0,spells:0};S.questClaimed=S.questClaimed||[];const save=()=>{try{localStorage.setItem('csw',JSON.stringify(S))}catch(e){}};

// Online 1v1: the host simulates the battle and relays snapshots to the guest.
let net={ws:null,role:'',room:'',ready:false,lastSync:0};
function netSend(data){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(data))}
function onlineMenu(){cancelAnimationFrame(raf);G=null;$.innerHTML=`<h1>🌐 Online Savaş</h1><div class="online-card"><p>Arkadaşınla oda kur veya herkese açık eşleşmeye katıl.</p><p><input id="roomCode" maxlength="6" placeholder="ODA KODU" autocomplete="off"></p><button class="sel" onclick="onlineConnect('create')">➕ Oda Kur</button><button onclick="onlineJoin()">🔑 Koda Katıl</button><button onclick="onlineConnect('quick')">⚔️ Rastgele Rakip Bul</button><div id="onlineStatus" class="online-status">Sunucuya bağlanmaya hazır.</div><button onclick="menu()">⬅ Ana Menü</button></div><p style="font-size:12px;color:#9eafc2">Online mod için oyunun sunucuda yayınlanan adresini kullanmalısın.</p>`}
function onlineConnect(action){const st=document.getElementById('onlineStatus');if(!st)return;st.textContent='Sunucuya bağlanılıyor…';if(net.ws)try{net.ws.close()}catch(e){};const proto=location.protocol==='https:'?'wss':'ws';const url=(location.protocol==='file:'?'ws://localhost:3000':proto+'://'+location.host);try{net.ws=new WebSocket(url)}catch(e){st.textContent='Bağlantı kurulamadı. Sunucu açık mı?';return}net.ws.onopen=()=>{net.ready=true;if(action!=='join')netSend({type:action})};net.ws.onerror=()=>{st.textContent='Sunucuya ulaşılamadı. Sunucuyu başlatıp sayfayı yeniden aç.'};net.ws.onclose=()=>{net.ready=false};net.ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.type==='created'){net.role='host';net.room=m.room;st.innerHTML='Oda kodun: <b>'+m.room+'</b> — arkadaşına gönder, rakip bekleniyor…'}else if(m.type==='waiting'){st.textContent='Rakip aranıyor…'}else if(m.type==='joined'){net.role='guest';net.room=m.room;st.textContent='Odaya katıldın. Rakip hazırlanıyor…'}else if(m.type==='matched'){net.role=m.role;net.room=m.room;st.textContent='Rakip bulundu! Savaş başlıyor…';setTimeout(startOnlineBattle,350)}else if(m.type==='state'&&net.role==='guest'&&G){const old=G;G=m.state;G.onlineGuest=true;G.onlineHost=false;G.sel=null;G.paused=false;if(!ctx||!document.getElementById('cv'))return}else if(m.type==='spawn'&&net.role==='host'&&G&&!G.over){spawnForSide(m.k,1)}else if(m.type==='ended'&&net.role==='guest'){showOnlineEnd(!m.win)}else if(m.type==='error'){st.textContent=m.message}}}
function onlineJoin(){const el=document.getElementById('roomCode');const code=(el?.value||'').trim().toUpperCase();if(!code){document.getElementById('onlineStatus').textContent='Önce oda kodunu yaz.';return}onlineConnect('join');const wait=()=>{if(net.ws&&net.ws.readyState===1)netSend({type:'join',room:code});else setTimeout(wait,100)};wait()}
function startOnlineBattle(){if(!net.role)return;G={onlineHost:net.role==='host',onlineGuest:net.role==='guest',online:true,c:0,i:0,nv:false,en:{n:'Rakip Krallık',c:'#e04040'},d:1,lv:0,mp:1,u:[],fx:[],pb:{x:60,hp:1200,max:1200},eb:{x:840,hp:1200,max:1200},gold:240,gold0:240,gold1:240,t:0,es:999999,over:0,mp:1};$.innerHTML=`<div class="battle-head">🌐 ONLINE 1v1 · Oda ${net.room} · ${net.role==='host'?'Mavi: Sen / Kırmızı: Rakip':'Kırmızı: Sen / Mavi: Rakip'}</div><canvas id="cv" width="900" height="400"></canvas><div id="hud"></div><div class="unit-controls">`+U.map((u,k)=>`<div class="unit-pick"><button class="unit-button" id="b${k}" onclick="spawn(${k})"><span class="unit-icon">${UNIT_ICONS[k]}</span></button><span class="unit-label">${u.n}<br><small>🪙 ${u.cost}</small></span></div>`).join('')+`</div><p class="ctl-hint">Her oyuncunun altını ayrıdır. Kendi askerlerin için kendi altının harcanır.</p><button onclick="leaveOnline()">🏳️ Maçtan Ayrıl</button>`;ctx=document.getElementById('cv').getContext('2d');cam=0;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}

if(G.sel){G.sel.tx=clampN(wx,30,870);G.sel.toy=clampN(wy-330,0,35)}});
function loop(now){if(!G)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!G.paused&&!G.onlineGuest)update(dt);if(G.onlineHost&&now-net.lastSync>100){net.lastSync=now;const snap=JSON.parse(JSON.stringify(G));snap.sel=null;netSend({type:'state',state:snap})}draw();if(G.paused){ctx.save();ctx.fillStyle='rgba(6,10,17,.58)';ctx.fillRect(0,0,ctx.canvas.width,400);ctx.fillStyle='#f4d58e';ctx.textAlign='center';ctx.font='bold 34px Segoe UI,Arial';ctx.fillText('DURAKLATILDI',ctx.canvas.width/2,185);ctx.font='16px Segoe UI,Arial';ctx.fillText('Devam etmek için P tuşuna bas',ctx.canvas.width/2,220);ctx.restore()}if(!G.over)raf=requestAnimationFrame(loop)}

function end(w){if(G&&G.online){if(G.onlineHost)netSend({type:'ended',win:!!w});G.over=1;setTimeout(()=>showOnlineEnd(w),400);return}if(G&&G.onlineHost)netSend({type:'ended',win:!!w});G.over=1;if(G.mode==='zombie'){let reward=null;if(w){S.znight=Math.max(S.znight,G.night);S.zwins++;if(S.zwins%3===0){reward=SP[Math.floor(Math.random()*SP.length)];S.zsp[reward.id]=(Number(S.zsp[reward.id])||0)+1}save()}setTimeout(()=>{if(!G)return;$.innerHTML=`<section class="result-panel"><h1>${w?'🌅 Şafak Söktü!':'🧟 Gece Düştü'}</h1><p>${w?(reward?`${G.night}. geceyi atlattın. Üç gece ödülün: ${reward.ic} ${reward.n} ×1`:`${G.night}. geceyi atlattın. Büyü ödülüne ${3-S.zwins%3} gece kaldı.`):'Kaleni zombiler bastı. Ordunu güçlendirip tekrar dene.'}</p><p>En yüksek gece: <b class="hotkey">${S.znight}</b> · Büyü ödül sayacı: ${S.zwins%3}/3 · Büyüler: ${SP.map(s=>`${s.ic} ×${Number(S.zsp[s.id])||0}`).join('　')}</p><button class="sel" onclick="startZombie(${w?G.night+1:G.night})">🌙 Tekrar / Sonraki Gece</button><button onclick="zombieMenu()">Gece Haritası</button><button onclick="menu()">Ana Menü</button></section>`;G=null},700);return}let r=0,kingdomGold=0;const c=G.c,i=G.i,d=G.d;
if(w){const first=i==S.prog[c];r=Math.round((first?4:2)*DM[d]);if(i==14)r+=Math.round((first?120:80)*DM[d]);if(first)S.prog[c]=i+1;S.dia+=r;if(c===3&&kingdomMapComplete()&&!S.kingdomMapRewarded){kingdomGold=350;S.altin+=kingdomGold;S.kingdomMapRewarded=true}S.altin+=5;S.dia+=2;S.questStats.wins=(Number(S.questStats.wins)||0)+1;save()}
setTimeout(()=>{if(!G)return;$.innerHTML=`<section class="result-panel"><h1>${w?'🏆 Zafer!':'🛡️ Yenilgi'}</h1><p>${w?`Kaleyi ele geçirdin. +💎 ${r+2} elmas, +🪙 5 altın kazandın${i==14?' · sefer tamamlama ödülü dahil':''}.${kingdomGold?` Krallık Haritası tamamlandı ve +🪙 ${kingdomGold} altın kazandın!`:''}`:'Ordun yenildi. Hazırlığını güçlendirip yeniden dene.'}</p><p>Elmas: <b class="hotkey">💎 ${S.dia}</b>　 Altın: <b class="hotkey">🪙 ${S.altin}</b></p>`+(w&&i<14?`<button class="sel" onclick="start(${c},${i+1})">➡ Sonraki Bölüm</button>`:'')+`<button onclick="start(${c},${i})">🔁 Tekrar Dene</button>${allExpeditionsComplete()?`<button class="sel" onclick="kingdom()">🏰 Krallık Haritası</button>`:''}<div><button onclick="shop()">👑 Kostümler</button><button onclick="camp(${c})">🗺️ Sefer Haritası</button></div></section>`;G=null},700)}
